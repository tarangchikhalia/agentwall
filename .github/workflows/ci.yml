name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false # No go.sum while the application uses only the standard library.
      - name: Verify
        run: make check

  policy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install contract-test dependencies
        run: |
          python3 -m venv /tmp/agentwall-policy-venv
          /tmp/agentwall-policy-venv/bin/python -m pip install -r tests/policy_schema/requirements.txt
      - name: Validate policy contract
        run: make policy-test PYTHON=/tmp/agentwall-policy-venv/bin/python
